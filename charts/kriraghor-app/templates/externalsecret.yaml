{{- if .Values.externalSecret.enabled }}
{{- if not .Values.externalSecret.remoteKey }}
{{- fail "externalSecret.remoteKey is required when externalSecret.enabled is true" }}
{{- end }}
# Secrets come from the cloud secret manager through External Secrets Operator (ADR-003).
# The remote key holds a JSON object whose keys become env vars.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.secretName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- if and (eq .Values.kind "Job") .Values.job.hook }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.storeKind }}
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: {{ include "app.secretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteKey }}
{{- end }}
