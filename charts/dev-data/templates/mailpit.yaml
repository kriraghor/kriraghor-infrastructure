apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels: { app: mailpit }
spec:
  selector: { app: mailpit }
  ports:
    - { name: smtp, port: 1025 }
    - { name: http, port: 8025 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailpit }
  template:
    metadata:
      labels: { app: mailpit }
    spec:
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mailpit.resources | nindent 12 }}
{{- if .Values.mailpit.ingressHost }}
---
# Mailpit UI and API, so you (and the E2E test) can read OTP emails.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailpit
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.mailpit.ingressHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port: { name: http }
{{- end }}
