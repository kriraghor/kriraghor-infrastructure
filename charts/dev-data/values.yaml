# DEV ONLY. Credentials come from the Secret "dev-data-credentials" created by local/secrets.sh.
credentialsSecret: dev-data-credentials

mysql:
  image: mysql:8.4
  storage: 2Gi
  database: kriraghor
  user: kriraghor
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 768Mi }

redis:
  image: redis:7.4-alpine
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

s3:
  image: chrislusf/seaweedfs:4.01
  storage: 1Gi
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 384Mi }

mailpit:
  image: axllent/mailpit:v1.27
  # Web UI for reading OTP emails, e.g. http://mail.kriraghor.localhost
  ingressHost: mail.kriraghor.localhost
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 96Mi }
