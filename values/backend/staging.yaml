# Shared non-secret config for every backend process (api, realtime, worker, migrate) in staging.
# Loaded first; values/backend-<process>/staging.yaml adds process-specific settings.
image:
  repository: ghcr.io/kriraghor/kriraghor-backend
  tag: "0.1.0"
  pullPolicy: IfNotPresent
labels:
  kriraghor.com/part-of: backend
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: "4000"
  REALTIME_PORT: "4001"
  OPS_PORT: "9464"
  TRUST_PROXY: "2"
  SHUTDOWN_DRAIN_MS: "5000"
  DB_POOL_MAX: "5"
  REDIS_KEY_PREFIX: kg
  CORS_ORIGINS: "https://staging.kriraghor.com,https://www.staging.kriraghor.com,https://esports.staging.kriraghor.com,https://vendor.staging.kriraghor.com"
  ADMIN_ORIGINS: "https://admin.staging.kriraghor.com"
  # M08 links in notifications and emails.
  WEB_APP_URL: https://staging.kriraghor.com
  ADMIN_APP_URL: https://admin.staging.kriraghor.com
  # M06 payments: SSLCommerz sandbox. SSLCOMMERZ_STORE_ID and SSLCOMMERZ_STORE_PASSWORD come from the
  # secret; until they exist, payment attempts answer PROVIDER_UNAVAILABLE. Test charges allowed.
  API_PUBLIC_URL: https://api.staging.kriraghor.com
  SSLCOMMERZ_BASE_URL: https://sandbox.sslcommerz.com
  PAYMENTS_TEST_CHARGES: "true"
  COOKIE_PREFIX: kgstg
  S3_BUCKET_PRIVATE: kriraghor-staging-private
  COOKIE_HINT_DOMAIN: ".staging.kriraghor.com"
  COOKIE_SECURE: "true"
  # DB_HOST, DB_USER, DB_PASSWORD and REDIS_URL (with its password) are in the secret.
  DB_PORT: "3306"
  DB_NAME: kriraghor
  EMAIL_DRIVER: smtp
  # The real BD SMS gateway waits for Q59 (gateway + BTRC sender ID); console until then (sandbox only).
  SMS_DRIVER: console
# Secret values (DB host and password, Redis URL, JWT, CSRF, OTP, encryption and S3 keys)
# come from the cloud secret manager key "staging/backend" (ADR-003).
externalSecret:
  enabled: true
  remoteKey: staging/backend
