# Shared non-secret config for every backend process (api, realtime, worker, migrate) in dev.
# Loaded first; values/backend-<process>/dev.yaml adds process-specific settings.
image:
  repository: k3d-registry.localhost:5111/kriraghor-backend
  tag: "dev"
  pullPolicy: Always
labels:
  kriraghor.com/part-of: backend
env:
  NODE_ENV: development
  LOG_LEVEL: info
  PORT: "4000"
  REALTIME_PORT: "4001"
  OPS_PORT: "9464"
  TRUST_PROXY: "1"
  SHUTDOWN_DRAIN_MS: "5000"
  DB_POOL_MAX: "5"
  REDIS_KEY_PREFIX: kg
  # M22: organiser sites are two labels deep ({sub}.esports.…), so they have their own pattern.
  CORS_ORIGINS: "http://kriraghor.localhost,http://*.kriraghor.localhost,http://*.esports.kriraghor.localhost"
  ADMIN_ORIGINS: "http://admin.kriraghor.localhost"
  # M08 links in notifications and emails.
  WEB_APP_URL: http://kriraghor.localhost
  ESPORTS_APP_URL: http://esports.kriraghor.localhost
  VENDOR_APP_URL: http://vendor.kriraghor.localhost/vendor
  ADMIN_APP_URL: http://admin.kriraghor.localhost
  # M06 payments: the gateway posts IPNs and returns to this origin. The SSLCommerz simulator plays the
  # gateway in dev (never in production; config refuses it), and masters can create test charges.
  API_PUBLIC_URL: http://api.kriraghor.localhost
  PAYMENTS_SIMULATOR: "true"
  PAYMENTS_TEST_CHARGES: "true"
  COOKIE_PREFIX: kg
  COOKIE_HINT_DOMAIN: ".kriraghor.localhost"
  COOKIE_SECURE: "false"
  DB_HOST: postgres.kriraghor-data.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: kriraghor
  DB_USER: kriraghor
  REDIS_URL: redis://redis.kriraghor-data.svc.cluster.local:6379
  EMAIL_DRIVER: smtp
  SMTP_HOST: mailpit.kriraghor-data.svc.cluster.local
  SMTP_PORT: "1025"
  S3_ENDPOINT: http://s3.kriraghor-data.svc.cluster.local:8333
  # M04 audit exports (and M02 KYC files later). The bucket is created on first use in dev only.
  S3_BUCKET_PRIVATE: kriraghor-private
  # M09 ground photos: a public bucket read anonymously (R2 or S3 with a CDN in staging and prod).
  S3_BUCKET_PUBLIC: kriraghor-public
  PUBLIC_ASSET_BASE_URL: http://assets.kriraghor.localhost/kriraghor-public
  S3_CREATE_BUCKETS: "true"
  SMS_DRIVER: console
# Dev: Secret created by local/secrets.sh (random values, never committed).
envFromSecrets: [backend-secrets]
