# Shared non-secret config for every backend process (api, realtime, worker, migrate) in prod.
# Loaded first; values/backend-<process>/prod.yaml adds process-specific settings.
image:
  repository: ghcr.io/kriraghor/kriraghor-backend
  tag: "0.1.0"
  pullPolicy: IfNotPresent
labels:
  kriraghor.com/part-of: backend
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: "4000"
  REALTIME_PORT: "4001"
  OPS_PORT: "9464"
  TRUST_PROXY: "2"
  SHUTDOWN_DRAIN_MS: "5000"
  DB_POOL_MAX: "10"
  REDIS_KEY_PREFIX: kg
  CORS_ORIGINS: "https://kriraghor.com,https://www.kriraghor.com,https://esports.kriraghor.com,https://*.esports.kriraghor.com,https://vendor.kriraghor.com,https://gym.kriraghor.com"
  ADMIN_ORIGINS: "https://admin.kriraghor.com"
  # M08 links in notifications and emails.
  WEB_APP_URL: https://kriraghor.com
  ESPORTS_APP_URL: https://esports.kriraghor.com
  VENDOR_APP_URL: https://vendor.kriraghor.com/vendor
  ADMIN_APP_URL: https://admin.kriraghor.com
  GYM_APP_URL: https://gym.kriraghor.com
  # M06 payments: live SSLCommerz (store credentials in the secret). No simulator, no test charges.
  API_PUBLIC_URL: https://api.kriraghor.com
  SSLCOMMERZ_BASE_URL: https://securepay.sslcommerz.com
  COOKIE_PREFIX: kg
  S3_BUCKET_PRIVATE: kriraghor-prod-private
  # M09 ground photos: a public bucket read anonymously (R2 or S3 with a CDN in staging and prod).
  S3_BUCKET_PUBLIC: kriraghor-prod-public
  PUBLIC_ASSET_BASE_URL: https://assets.kriraghor.com
  COOKIE_HINT_DOMAIN: ".kriraghor.com"
  COOKIE_SECURE: "true"
  # DB_HOST, DB_USER, DB_PASSWORD and REDIS_URL (with its password) are in the secret.
  DB_PORT: "5432"
  DB_NAME: kriraghor
  EMAIL_DRIVER: smtp
  # The real BD SMS gateway waits for Q59 (gateway + BTRC sender ID); console until then (sandbox only).
  SMS_DRIVER: console
# Secret values (DB host and password, Redis URL, JWT, CSRF, OTP, encryption and S3 keys)
# come from the cloud secret manager key "prod/backend" (ADR-003).
externalSecret:
  enabled: true
  remoteKey: prod/backend
