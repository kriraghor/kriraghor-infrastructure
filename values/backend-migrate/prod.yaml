# Schema migrations as a pre-install/pre-upgrade hook Job (ADR-003). Expand-and-contract only.
nameOverride: backend-migrate
kind: Job
args: ["node_modules/sequelize-cli/lib/sequelize", "db:migrate"]
containerPort: 0
opsPort: 0
networkPolicy:
  enabled: false
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 256Mi }
job:
  hook: true
  backoffLimit: 1
  activeDeadlineSeconds: 900
