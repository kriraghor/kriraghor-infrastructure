# Copy to kriraghor-<web|esports|portal|gym>/.github/workflows/ci.yml and set APP.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: kriraghor/kriraghor-infrastructure/.github/workflows/nextjs-app.yml@main
    with:
      image: kriraghor-web            # kriraghor-esports | kriraghor-portal | kriraghor-gym
      values-files: values/web/staging.yaml
    secrets: inherit
