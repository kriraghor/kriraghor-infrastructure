# Reusable CI for the Expo mobile app (kriraghor-mobile-app): lint → typecheck → unit tests.
# Store builds stay manual (EAS) for now; this only keeps main green.
name: expo-app

on:
  workflow_call:
    inputs:
      app-dir:
        description: The app folder in the caller repo ("." for kriraghor-mobile-app)
        type: string
        default: "."
      node-version:
        type: string
        default: "24.16.0"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.app-dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.app-dir }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
