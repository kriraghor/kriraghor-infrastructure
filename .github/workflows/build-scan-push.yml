# Shared image stage: build → Trivy (fails on fixable HIGH/CRITICAL) → push to GHCR (main only)
# → pull request in kriraghor-infra bumping image.tag for staging. Prod is promoted later by
# promote.yml with the SAME tag: images are never rebuilt between environments (ADR-003).
name: build-scan-push

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      values-files:
        type: string
        required: true
    secrets:
      INFRA_PR_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/kriraghor/${{ inputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build (load for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main'
        run: docker push "${IMAGE}:${{ steps.meta.outputs.tag }}"
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

  bump-staging:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        id: token
        run: echo "present=${{ secrets.INFRA_PR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: kriraghor/kriraghor-infra
          token: ${{ secrets.INFRA_PR_TOKEN }}
      - if: steps.token.outputs.present == 'true'
        name: Bump image.tag
        env:
          TAG: ${{ needs.image.outputs.tag }}
          FILES: ${{ inputs.values-files }}
        run: |
          for f in $FILES; do
            yq -i '.image.tag = strenv(TAG)' "$f"
          done
      - if: steps.token.outputs.present == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.INFRA_PR_TOKEN }}
          branch: bump/${{ inputs.image }}-staging
          commit-message: "chore(staging): ${{ inputs.image }} ${{ needs.image.outputs.tag }}"
          title: "chore(staging): ${{ inputs.image }} ${{ needs.image.outputs.tag }}"
          body: Automated image-tag bump from ${{ github.repository }}@${{ github.sha }}.
