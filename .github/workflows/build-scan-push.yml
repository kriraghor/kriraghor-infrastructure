# Shared image stage: build → Trivy (fails on fixable HIGH/CRITICAL) → push to GHCR (main only)
# → pull request in kriraghor-infrastructure bumping image.tag for staging. Prod is promoted later by
# promote.yml with the SAME tag: images are never rebuilt between environments (ADR-003).
name: build-scan-push

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      context:
        description: Docker build context (the repo root for kriraghor-frontend's workspaces)
        type: string
        default: "."
      file:
        description: Dockerfile path from the repo root; empty means <context>/Dockerfile (the backend)
        type: string
        default: ""
      values-files:
        type: string
        required: true
    secrets:
      INFRA_PR_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/kriraghor/${{ inputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        run: echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (load for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main'
        run: docker push "${IMAGE}:${{ steps.meta.outputs.tag }}"
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

  bump-staging:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        id: token
        run: echo "present=${{ secrets.INFRA_PR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kriraghor/kriraghor-infrastructure
          token: ${{ secrets.INFRA_PR_TOKEN }}
      - if: steps.token.outputs.present == 'true'
        name: Bump image.tag
        env:
          TAG: ${{ needs.image.outputs.tag }}
          FILES: ${{ inputs.values-files }}
        run: |
          for f in $FILES; do
            yq -i '.image.tag = strenv(TAG)' "$f"
          done
      - if: steps.token.outputs.present == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.INFRA_PR_TOKEN }}
          branch: bump/${{ inputs.image }}-staging
          commit-message: "chore(staging): ${{ inputs.image }} ${{ needs.image.outputs.tag }}"
          title: "chore(staging): ${{ inputs.image }} ${{ needs.image.outputs.tag }}"
          body: Automated image-tag bump from ${{ github.repository }}@${{ github.sha }}.
