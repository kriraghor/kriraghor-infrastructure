# App of apps for prod (ADR-003). Apply once per cluster:
#   kubectl apply -n argocd -f argocd/projects/kriraghor.yaml -f argocd/envs/prod/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kriraghor-prod
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: kriraghor
  source:
    repoURL: https://github.com/kriraghor/kriraghor-infrastructure.git
    targetRevision: main
    path: argocd/envs/prod/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
