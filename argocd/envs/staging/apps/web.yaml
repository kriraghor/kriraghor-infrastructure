# Sync wave 1: data (-2) → migrations (-1) → backend (0) → frontends (1).
# For waves to wait on child health, Argo CD needs the Application health check enabled
# (resource.customizations.health.argoproj.io_Application in argocd-cm; see README).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: kriraghor
  sources:
    - repoURL: https://github.com/kriraghor/kriraghor-infrastructure.git
      targetRevision: main
      path: charts/kriraghor-app
      helm:
        releaseName: web
        valueFiles:
        - $values/values/web/staging.yaml
    - repoURL: https://github.com/kriraghor/kriraghor-infrastructure.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kriraghor
  # Staging: every merge to main deploys automatically.
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
