# Sync wave -2: data (-2) → migrations (-1) → backend (0) → frontends (1).
# For waves to wait on child health, Argo CD needs the Application health check enabled
# (resource.customizations.health.argoproj.io_Application in argocd-cm; see README).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-data-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: kriraghor
  sources:
    - repoURL: https://github.com/kriraghor/kriraghor-infrastructure.git
      targetRevision: main
      path: charts/dev-data
      helm:
        releaseName: dev-data
    - repoURL: https://github.com/kriraghor/kriraghor-infrastructure.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kriraghor-data
  # Dev: sync by hand (local k3d normally uses local/deploy.sh instead of Argo CD).
  syncPolicy:
    syncOptions: [CreateNamespace=true]
