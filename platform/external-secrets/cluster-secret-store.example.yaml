# EXAMPLE ONLY: the provider is chosen together with the cloud (ADR-003, open in 0B report).
# Every app's ExternalSecret points at the ClusterSecretStore "kriraghor-secrets"; only this file
# changes when the provider is decided. Keys follow "<env>/<app>", each a JSON object of env vars:
#   staging/backend → {"DB_HOST":"…","DB_USER":"…","DB_PASSWORD":"…","REDIS_URL":"rediss://…",
#                      "JWT_ACCESS_SECRET":"…","JWT_SPECIAL_SECRET":"…","CSRF_SECRET":"…",
#                      "OTP_HASH_SECRET":"…","DATA_ENCRYPTION_KEY":"…","S3_ENDPOINT":"…",
#                      "S3_ACCESS_KEY":"…","S3_SECRET_KEY":"…","SMTP_HOST":"…", …}
#
# Option A, AWS Secrets Manager (EKS with IRSA):
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kriraghor-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
# Option B, DigitalOcean (no native secret manager): use Doppler, 1Password or Infisical as the
# provider, e.g.
#   provider:
#     doppler:
#       auth:
#         secretRef:
#           dopplerToken: { name: doppler-token, key: token, namespace: external-secrets }
